<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento confirmado</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f5f5; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { background: #fff; max-width: 420px; width: 90%; padding: 32px 24px; border-radius: 8px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .check { width: 72px; height: 72px; border-radius: 50%; background: #00a650; color: #fff; font-size: 40px; line-height: 72px; margin: 0 auto 20px; }
        h1 { font-size: 20px; color: #333; margin: 0 0 10px; }
        p { font-size: 14px; color: #666; line-height: 1.5; margin: 0 0 24px; }
        a { display: inline-block; background: #3483fa; color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <div class="check">&#10003;</div>
        <h1>Pagamento confirmado!</h1>
        <p>Recebemos o seu pagamento. A liberação da encomenda será processada em instantes.</p>
        <a href="index.html">Voltar ao início</a>
    </div>
</body>
</html>
