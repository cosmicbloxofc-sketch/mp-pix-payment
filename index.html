<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Livre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #fff;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            width: 200px;
            margin-bottom: 30px;
        }
        h1 {
            color: #3483fa;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .btn {
            background: #3483fa;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #2968c8;
        }
        .loading {
            display: none;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://http2.mlstatic.com/frontend-assets/ui-navigation/5.21.2/mercadolibre/logo__large_plus.png" alt="Mercado Livre" class="logo">
        <h1>Bem-vindo ao Mercado Livre</h1>
        <button class="btn" onclick="iniciar()">Começar</button>
        <div class="loading" id="loading">Carregando...</div>
    </div>

    <script>
        function iniciar() {
            document.getElementById('loading').style.display = 'block';
            setTimeout(() => {
                window.location.href = 'index2.html';
            }, 500);
        }
    </script>
</body>
</html>
